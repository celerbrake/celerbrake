name: celerbrake

on: [push]

permissions:
  contents: read

jobs:
  test:
    strategy:
      # One red entry must not cancel the others, or the matrix reports a single
      # failure plus N cancellations and the real state is unknowable.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: [2.6, 2.7, 3.0, 3.1, jruby]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Update package list
        run: sudo apt-get update

      - name: Install cURL Headers
        run: sudo apt-get install libcurl4 libcurl4-openssl-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install Bundler dependencies
        run: bundle install

      - name: Display Ruby version
        run: ruby -v

      # Unit specs need only the main bundle, so run them BEFORE appraisal. The
      # integration gemfiles pull `resque_spec` from github:celerbrake/resque_spec,
      # a fork that was never created when these gems moved into the org — so
      # `appraisal install` cannot resolve and, in the old order, took the unit
      # suite down with it. Until that repo exists, this is the difference
      # between some coverage and none.
      - name: Unit tests
        run: bundle exec rake spec:unit

      - name: Install Appraisal dependencies
        run: bundle exec appraisal install

      - name: Test Rails 5.2
        if: ${{ matrix.ruby != '3.0' && matrix.ruby != '3.1' }}
        run: bundle exec appraisal rails-5.2 rake spec:integration:rails

      - name: Test Rails 6.0
        run: bundle exec appraisal rails-6.0 rake spec:integration:rails

      - name: Test Rails 6.1
        run: bundle exec appraisal rails-6.1 rake spec:integration:rails

      - name: Test Rails 7.0
        if: ${{ matrix.ruby != '2.6' && matrix.ruby != 'jruby' }}
        run: bundle exec appraisal rails-7.0 rake spec:integration:rails

      - name: Test Sinatra
        run: bundle exec appraisal sinatra rake spec:integration:sinatra

      - name: Test Rack
        run: bundle exec appraisal rack rake spec:integration:rack

      # Lint LAST, on purpose. It used to run first, so a style offence skipped
      # every step below it — and because `.rubocop.yml` sets `NewCops: enable`
      # against an unpinned rubocop, a new cop in someone else's release could
      # do that without a line changing here. That is how this workflow went red
      # on 2026-05-20 and stayed red, with no test having run since. The job
      # still FAILS on an offence; it just no longer hides whether the suites
      # pass.
      - name: Rubocop lint
        run: bundle exec rubocop
